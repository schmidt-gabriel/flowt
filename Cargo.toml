[package]
name = "flowt"
version = "0.1.0"
edition = "2021"
description = "A terminal workflow automation engine"

[[bin]]
name = "flowt"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
clap = { version = "4", features = ["derive"] }
cron = "0.12"
dotenv = "0.15"
