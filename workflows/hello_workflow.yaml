name: Hello Workflow
description: Initial Checks
enabled: true
triggers:
- type: cron
  schedule: "0 */5 * * * *"

nodes:
- id: hello-world
  type: shell
  cmd: echo "Hello, World!"
  env: {}
  when: null
  retry: null
  timeout: null

- id: my-system
  type: shell
  cmd: echo "Running on $(uname -s) with $(uname -r)"
  env: {}
  when: null
  retry: null
  timeout: null

- id: fetch-data
  type: http
  url: "https://jsonplaceholder.typicode.com/todos/1"
  method: GET
  expect_status: 200
  retry: 3
  timeout: "30s"
  
- id: timestamp
  type: shell
  cmd: date
  env: {}
  when: null
  retry: null
  timeout: null
