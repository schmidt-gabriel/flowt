name: Cron Workflow
description: Simple scheduled workflow  
enabled: true
triggers:
  - type: cron
    schedule: "0 */10 * * * *"  # Every 10 minutes

nodes:
  - id: hello-step
    type: shell
    cmd: echo "Hello from scheduled workflow at $(date)"
    env: {}

  - id: http-step
    type: http
    url: "https://jsonplaceholder.typicode.com/todos/1"
    method: GET
    expect_status: 200
    retry: 3
    timeout: "30s"
    depends_on: ["hello-step"]
